<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Super Admin — Horticulture Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1318;--sidebar:#0a0e14;--card:#161d28;--border:#252f3f;
  --text:#edf2f9;--muted:#8899b0;--sub:#526070;
  --green:#4ade80;--blue:#60a5fa;--purple:#c084fc;
  --amber:#fbbf24;--red:#f87171;--teal:#2dd4bf;
  --accent:#2d6a4f;--catA:#7c8cff;--catB:#34d399;--catC:#f6ad55;
}
body{font-family:'Noto Serif Bengali','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 60% 0%,#1e1b4b,#0f172a 60%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:400px}
.login-logo{width:56px;height:56px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:20px}
.login-box h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:11px 14px;background:#0f172a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none}
.field input:focus{border-color:var(--accent)}
.btn-login{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600}
.err{color:var(--red);font-size:13px;margin-top:10px;text-align:center}

/* APP LAYOUT */
.app{display:none;height:100vh;overflow:hidden}
.app-layout{display:flex;height:100%}

/* SIDEBAR */
.sidebar{width:260px;min-width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;position:sticky;top:0}
.sidebar-header{padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sidebar-logo-icon{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo-text{font-size:14px;font-weight:700;line-height:1.2}
.sidebar-logo-sub{font-size:10px;color:var(--muted)}
.admin-card{background:var(--bg);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.admin-av{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.admin-name{font-size:13px;font-weight:600}
.admin-role{font-size:11px;color:var(--muted);margin-top:2px}

/* SIDEBAR NAV */
.sidebar-nav{flex:1;padding:12px 8px}
.nav-section-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:.15s;font-family:inherit;margin-bottom:2px}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}.nav-item i{font-size:16px;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:#334155;color:var(--muted);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.nav-item.active .badge{background:rgba(255,255,255,.15);color:#fff}
.nav-catA{color:var(--catA)}.nav-catA.active,.nav-catA:hover{background:#1e1b4b;color:var(--catA)}
.nav-catB{color:var(--catB)}.nav-catB.active,.nav-catB:hover{background:#052e16;color:var(--catB)}
.nav-catC{color:var(--catC)}.nav-catC.active,.nav-catC:hover{background:#431407;color:var(--catC)}
.nav-divider{height:1px;background:var(--border);margin:8px 0}

.sidebar-footer{padding:12px 8px;border-top:1px solid var(--border)}
.btn-logout{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--red);font-size:13px;border:none;background:none;width:100%;font-family:inherit;transition:.15s}
.btn-logout:hover{background:#450a0a}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--sidebar);border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.refresh-btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;font-family:inherit}
.refresh-btn:hover{border-color:var(--accent)}

.main-content{flex:1;overflow-y:auto;padding:24px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.kpi-label{font-size:16px;color:#ffffff;margin-bottom:0px;display:flex;align-items:center;gap:3px}
.kpi-value{font-size:26px;font-weight:700}
.kpi.green .kpi-value{color:var(--green)}.kpi.blue .kpi-value{color:var(--blue)}
.kpi.purple .kpi-value{color:var(--purple)}.kpi.amber .kpi-value{color:var(--amber)}.kpi.teal .kpi-value{color:var(--teal)}
.kpi-sub{font-size:13px;color:#aaaaaa;margin-top:4px}

/* HORIZONTAL CENTER CARDS */
.center-list{display:flex;flex-direction:column;gap:8px}
.h-card{background:var(--card);border:1px solid var(--border);border-radius:0;border-left:2px solid transparent;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
.h-card.catA{border-left-color:var(--catA)}
.h-card.catB{border-left-color:var(--catB)}
.h-card.catC{border-left-color:var(--catC)}
.h-card:hover{background:#1a2232;border-color:var(--border)}
.h-card-rank{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.h-card-rank.catA{background:#131a3a;color:var(--catA)}
.h-card-rank.catB{background:#0a1f16;color:var(--catB)}
.h-card-rank.catC{background:#1f1608;color:var(--catC)}
.h-card-info{flex:1;min-width:0}
.h-card-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-card-sub{font-size:13px;color:rgba(255,255,255,0.64);margin-top:2px}
.h-card-stats{display:flex;gap:20px;flex-shrink:0}
.h-stat{text-align:center}
.h-stat-v{font-size:16px;font-weight:700}
.h-stat-l{font-size:13px;color:#ffffff;margin-top:2px}
.h-card-actions{display:flex;gap:6px;flex-shrink:0}
.h-btn{padding:7px 14px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:transparent;color:var(--muted);display:flex;align-items:center;gap:4px;transition:.15s}
.h-btn:hover{border-color:var(--accent);color:var(--purple)}
.h-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.h-btn.primary:hover{background:#6d28d9}

/* CAT HEADER */
.cat-group{margin-bottom:20px}
.cat-group-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 14px;border-radius:0;background:transparent;border:none;border-left:3px solid}
.cat-group-header.catA{border-color:var(--catA)}.cat-group-header.catB{border-color:var(--catB)}.cat-group-header.catC{border-color:var(--catC)}
.cat-group-title{font-size:13px;font-weight:600}
.cat-group-title.catA{color:var(--catA)}.cat-group-title.catB{color:var(--catB)}.cat-group-title.catC{color:var(--catC)}
.cat-group-count{font-size:11px;color:var(--muted);margin-left:4px}

/* DETAIL */
.back-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);font-family:inherit;margin-bottom:16px}
.detail-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.dtab{padding:8px 16px;background:var(--border);border:none;color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;transition:.2s}
.dtab.active{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card-head span{font-size:12px;color:var(--muted);font-weight:400}
.card-body{padding:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-size:14px;color:#a0a4a8;font-weight:600;background:#0f172a;white-space:nowrap}
th{padding:9px 12px;text-align:left;font-size:11px;color:var(--muted);font-weight:600;background:#0f172a;white-space:nowrap}
td{padding:9px 12px;font-size:13px;border-top:1px solid #1e293b;white-space:nowrap}
tr:hover td{background:#1a2438}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px}
.pill.paid{background:#064e3b;color:var(--green)}.pill.due{background:#450a0a;color:var(--red)}
.pill.active{background:#1e3a5f;color:var(--blue)}.pill.sold{background:#312e81;color:var(--purple)}
.pill.on{background:#064e3b;color:var(--green)}.pill.off{background:#450a0a;color:var(--red)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--muted);width:80px;text-align:right;flex-shrink:0}
.bar-track{flex:1;background:#0f172a;border-radius:4px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#fff;min-width:30px}
.bar-end{font-size:12px;color:var(--text);font-weight:600;width:80px;flex-shrink:0}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.user-item{background:#0f172a;border-radius:9px;padding:12px;display:flex;align-items:center;gap:10px}
.user-av{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:600}.user-email{font-size:11px;color:var(--muted)}

/* COMPARE */
.score-ring{width:60px;height:60px;position:relative;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-size:15px;font-weight:800;line-height:1}
.score-lbl{font-size:8px;color:var(--muted)}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tl-green{background:#4ade80;box-shadow:0 0 6px #4ade8066}
.tl-yellow{background:#fbbf24;box-shadow:0 0 6px #fbbf2466}
.tl-red{background:#f87171;box-shadow:0 0 6px #f8717166}
.target-track{height:8px;background:#0f172a;border-radius:4px;overflow:hidden;flex:1}
.target-fill{height:100%;border-radius:4px}
.target-fill.good{background:#4ade80}.target-fill.ok{background:#fbbf24}.target-fill.bad{background:#f87171}
.growth-up{color:#4ade80;background:#064e3b;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.growth-dn{color:#f87171;background:#450a0a;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.compare-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.compare-row:last-child{border:none}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-hdr h3{font-size:15px;font-weight:600}
.close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;background:#0f172a;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:60px;font-size:12px;font-family:monospace}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:10px;color:var(--sub);margin-top:3px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{padding:9px 18px;background:var(--border);color:var(--text);border:none;border-radius:7px;cursor:pointer}
.btn-save{padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-weight:600}

.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--accent);color:var(--text);padding:11px 16px;border-radius:10px;font-size:13px;z-index:300;display:none}
.toast.show{display:block;animation:sIn .3s ease}
@keyframes sIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:40px;color:var(--sub)}
.empty i{font-size:32px;display:block;margin-bottom:8px;opacity:.4}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;justify-content:center;padding:40px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">🌿</div>
    <h1>Super Admin Panel</h1>
    <p>Horticulture Management System — DAE</p>
    <div class="field"><label>ইমেইল</label><input type="email" id="saEmail" placeholder="director@horticulture.bd"/></div>
    <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="saPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')saLogin()"/></div>
    <button class="btn-login" onclick="saLogin()">লগইন করুন</button>
    <div class="err" id="saErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="saApp">
  <div class="app-layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">🌿</div>
          <div><div class="sidebar-logo-text">HortNet-BD</div><div class="sidebar-logo-sub">Super Admin</div></div>
        </div>
        <div class="admin-card">
          <div class="admin-av" id="adminAv">A</div>
          <div><div class="admin-name" id="adminName">—</div><div class="admin-role" id="adminRole">—</div></div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">মূল মেনু</div>
        <button class="nav-item active" onclick="navTo('overview',this)" id="nav-overview">
          <i class="ti ti-layout-dashboard"></i> Overview <span class="badge" id="badge-overview">—</span>
        </button>

        <div class="nav-divider"></div>
        <div class="nav-section-label">Center Category</div>

        <button class="nav-item nav-catA" onclick="navTo('catA',this)" id="nav-catA">
          <i class="ti ti-building-skyscraper"></i> 🏛️ A — উপপরিচালক
          <span class="badge" id="badge-catA">0</span>
        </button>
        <button class="nav-item nav-catB" onclick="navTo('catB',this)" id="nav-catB">
          <i class="ti ti-plant"></i> 🌿 B — উদ্যানতত্ত্ববিদ
          <span class="badge" id="badge-catB">0</span>
        </button>
        <button class="nav-item nav-catC" onclick="navTo('catC',this)" id="nav-catC">
          <i class="ti ti-leaf"></i> 🪴 C — নার্সারী তত্ত্বাবধায়ক
          <span class="badge" id="badge-catC">0</span>
        </button>

        <div class="nav-divider"></div>
        <div class="nav-section-label">রিপোর্ট</div>
        <button class="nav-item" onclick="navTo('compare',this)" id="nav-compare">
          <i class="ti ti-chart-bar"></i> তুলনামূলক রিপোর্ট
        </button>
        <button class="nav-item" onclick="navTo('targetSummary',this)" id="nav-targetSummary">
          <i class="ti ti-target"></i> লক্ষ্যমাত্রা সারসংক্ষেপ
        </button>
        <button class="nav-item" onclick="navTo('districtSummary',this)" id="nav-districtSummary">
          <i class="ti ti-map-pin"></i> জেলাভিত্তিক সারসংক্ষেপ
        </button>

        <div id="directorOnly" style="display:none">
          <div class="nav-divider"></div>
          <div class="nav-section-label">পরিচালক</div>
          <button class="nav-item" onclick="navTo('allCenters',this)" id="nav-allCenters">
            <i class="ti ti-settings"></i> সব Center পরিচালনা
          </button>
          <button class="nav-item" onclick="navTo('adminMgmt',this)" id="nav-adminMgmt">
            <i class="ti ti-users-group"></i> Admin পরিচালনা
            <span class="badge" id="badge-admins">—</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout" onclick="saLogout()"><i class="ti ti-logout"></i> লগআউট</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="topbarTitle">Overview</div>
        <div class="topbar-right">
          <div id="topbarAdminInfo" style="text-align:right;margin-right:12px;display:none">
            <div style="font-size:12px;font-weight:600;color:var(--text)" id="topbarAdminName"></div>
            <div style="font-size:10px;color:var(--muted)" id="topbarAdminRole"></div>
          </div>
          <button class="refresh-btn" onclick="refreshAll()"><i class="ti ti-refresh"></i> Refresh</button>
        </div>
      </div>

      <div class="main-content" id="mainContent">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="centerModal">
  <div class="modal-box">
    <div class="modal-hdr">
      <h3 id="modalTitle">নতুন Center</h3>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <input type="hidden" id="editId"/>
    <div class="fg-row">
      <div class="fg"><label>Slug*</label><input id="fSlug" placeholder="dhaka"/></div>
      <div class="fg"><label>Category*</label>
        <select id="fCategory"><option value="A">A — উপপরিচালক</option><option value="B" selected>B — উদ্যানতত্ত্ববিদ</option><option value="C">C — নার্সারী তত্ত্বাবধায়ক</option></select>
      </div>
    </div>
    <div class="fg"><label>নাম (বাংলা)*</label><input id="fNameBn" placeholder="উদ্যানতত্ত্ববিদের কার্যালয়"/></div>
    <div class="fg"><label>Name (English)*</label><input id="fNameEn" placeholder="Horticulture Center, Dhaka"/></div>
    <div class="fg-row">
      <div class="fg"><label>District</label><input id="fDistrict" placeholder="ঢাকা"/></div>
      <div class="fg"><label>Division</label><input id="fDivision" placeholder="ঢাকা"/></div>
    </div>
    <div class="fg"><label>Location</label><input id="fLocation" placeholder="ঢাকা সদর"/></div>
    <div class="fg"><label>Database URL*</label>
      <textarea id="fDbUrl" placeholder="postgresql://postgres.xxxx:PASS@aws-x.pooler.supabase.com:6543/postgres?pgbouncer=true"></textarea>
      <div class="hint">Supabase → Settings → Database → Connection Pooling → Transaction mode</div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">বাতিল</button>
      <button class="btn-save" onclick="saveCenter()">সংরক্ষণ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='/api/superadmin';
let token=localStorage.getItem('sa_token');
let centers=[],allStats=[],currentView='overview',currentDetailSlug='',currentDetailData=null,currentDTab='dSales';
let userRole='director',assignedCenters=[];
const COLORS=['#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];

if(token) showApp();

function decodeToken(t){
  try{
    const base64=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const decoded=decodeURIComponent(
      atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')
    );
    return JSON.parse(decoded);
  }catch{return {};}
}

async function saLogin(){
  const email=document.getElementById('saEmail').value.trim();
  const pass=document.getElementById('saPass').value;
  document.getElementById('saErr').textContent='';
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(!d.success)return document.getElementById('saErr').textContent=d.message;
    token=d.token;localStorage.setItem('sa_token',token);showApp();
  }catch{document.getElementById('saErr').textContent='সংযোগ ব্যর্থ।';}
}

function showApp(){
  const payload=decodeToken(token);
  userRole=payload.role||'director';
  assignedCenters=payload.assignedCenters||[];
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('saApp').style.display='block';

  // Role labels
  const rLabels={
    director:'পরিচালক',
    deputy_director:'উপপরিচালক',
    horticulturist:'উদ্যানতত্ত্ববিদ',
    nursery_supervisor:'নার্সারী তত্ত্বাবধায়ক'
  };

  // Line 1: শুধু পদবী → "উপপরিচালক"
  const locationName=payload.name||'';
  const district=payload.district||'';
  const division=payload.division||'';
  const line1=rLabels[userRole]||userRole;
  document.getElementById('adminName').textContent=line1;
  document.getElementById('adminAv').textContent=(rLabels[userRole]||'প').charAt(0).toUpperCase();

  // Line 2: হর্টিকালচার সেন্টার, বনরূপা, রাঙামাটি
  const parts=userRole==='director'
    ?['হর্টিকালচার উইং, DAE'].filter(Boolean)
    :['হর্টিকালচার সেন্টার',locationName,district].filter(Boolean);
  document.getElementById('adminRole').textContent=parts.join(', ');

  // Topbar ডানে: "উপপরিচালক, বনরূপা"
  document.getElementById('topbarAdminInfo').style.display='block';
  document.getElementById('topbarAdminName').textContent=
    rLabels[userRole]+(locationName?', '+locationName:'');
  document.getElementById('topbarAdminRole').textContent=
    district+(division?', '+division:'');

  if(userRole==='director') document.getElementById('directorOnly').style.display='block';

  // Role-based color theme
  const themes={
    director:{accent:'#2d6a4f',sidebar:'#090d12'},
    deputy_director:{accent:'#1a6b4a',sidebar:'#071410'},
    horticulturist:{accent:'#1a5a8a',sidebar:'#071019'},
    nursery_supervisor:{accent:'#8a5a1a',sidebar:'#191007'}
  };
  const theme=themes[userRole]||themes.director;
  document.documentElement.style.setProperty('--accent',theme.accent);
  document.documentElement.style.setProperty('--sidebar',theme.sidebar);
  document.body.setAttribute('data-role',userRole);
  loadAll();
}

function saLogout(){localStorage.removeItem('sa_token');location.reload();}

async function loadAll(){
  await Promise.all([loadCenters(),loadAllStats(),loadAdmins()]);
  renderView(currentView);
}

let allAdmins=[];
async function loadAdmins(){
  if(userRole!=='director') return;
  try{
    const r=await fetch(API+'/admins',{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();
    if(d.success){
      allAdmins=d.data;
      document.getElementById('badge-admins').textContent=d.data.length;
    }
  }catch{}
}

async function refreshAll(){await loadAll();}

async function loadCenters(){
  try{const r=await fetch(API+'/tenants',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(d.success)centers=d.data;}catch{}
}

async function loadAllStats(){
  try{const r=await fetch(API+'/stats-all',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(d.success){allStats=d.data;updateBadges();}}catch{}
}

function updateBadges(){
  const ok=allStats.filter(c=>c.status==='ok');
  document.getElementById('badge-overview').textContent=ok.length+' center';
  ['A','B','C'].forEach(cat=>{
    const n=ok.filter(c=>c.category===cat).length;
    document.getElementById('badge-cat'+cat).textContent=n;
  });
}

function navTo(view,btn){
  document.querySelectorAll('.nav-item').forEach(b=>{
    b.classList.remove('active');
  });
  btn.classList.add('active');
  currentView=view;
  if(view==='detail') return;
  const titles={overview:'📊 Overview',catA:'🏛️ A Category — উপপরিচালক',catB:'🌿 B Category — উদ্যানতত্ত্ববিদ',catC:'🪴 C Category — নার্সারী তত্ত্বাবধায়ক',compare:'📈 তুলনামূলক রিপোর্ট',targetSummary:'🎯 লক্ষ্যমাত্রা সারসংক্ষেপ',districtSummary:'🗺️ জেলাভিত্তিক সারসংক্ষেপ',allCenters:'⚙️ সব Center পরিচালনা',adminMgmt:'👥 Admin পরিচালনা'};
  document.getElementById('topbarTitle').textContent=titles[view]||'Overview';
  renderView(view);
}

function renderView(view){
  const el=document.getElementById('mainContent');
  if(view==='overview') renderOverview(el);
  else if(view==='catA') renderCategoryView(el,'A');
  else if(view==='catB') renderCategoryView(el,'B');
  else if(view==='catC') renderCategoryView(el,'C');
  else if(view==='compare') renderCompareView(el);
  else if(view==='targetSummary') renderTargetSummaryView(el);
  else if(view==='districtSummary') renderDistrictSummaryView(el);
  else if(view==='allCenters') renderAllCenters(el);
  else if(view==='adminMgmt') renderAdminMgmt(el);
}

// ── OVERVIEW ──
function renderOverview(el){
  const ok=allStats.filter(c=>c.status==='ok');
  const totalRev=ok.reduce((s,c)=>s+c.total_revenue,0);
  const todayRev=ok.reduce((s,c)=>s+c.today_revenue,0);
  const totalProd=ok.reduce((s,c)=>s+c.total_produced,0);
  const totalStock=ok.reduce((s,c)=>s+c.total_stock,0);
  const invoices=ok.reduce((s,c)=>s+c.total_invoices,0);

  const catGroups={A:[],B:[],C:[]};
  ok.forEach(c=>{const cat=c.category||'B';catGroups[cat]?.push(c);});

  el.innerHTML=`
    <div class="kpi-grid">
      <div class="kpi green"><div class="kpi-label">মোট বিক্রয়</div><div class="kpi-value">৳${fmt(totalRev)}</div><div class="kpi-sub">${invoices} চালান</div></div>
      <div class="kpi blue"><div class="kpi-label">আজকের বিক্রয়</div><div class="kpi-value">৳${fmt(todayRev)}</div></div>
      <div class="kpi purple"><div class="kpi-label">মোট উৎপাদন</div><div class="kpi-value">${fmtN(totalProd)}</div></div>
      <div class="kpi amber"><div class="kpi-label">মোট স্টক</div><div class="kpi-value">${fmtN(totalStock)}</div></div>
      <div class="kpi teal"><div class="kpi-label">সক্রিয় Center</div><div class="kpi-value">${ok.length}</div></div>
    </div>
    ${['A','B','C'].map(cat=>{
      if(!catGroups[cat]?.length) return '';
      const catNames={A:'A Category — উপপরিচালক',B:'B Category — উদ্যানতত্ত্ববিদ',C:'C Category — নার্সারী তত্ত্বাবধায়ক'};
      return `<div class="cat-group">
        <div class="cat-group-header cat${cat}">
          <span class="cat-group-title cat${cat}">${catNames[cat]}</span>
          <span class="cat-group-count">(${catGroups[cat].length}টি center)</span>
        </div>
        <div class="center-list">${catGroups[cat].map(c=>hCard(c)).join('')}</div>
      </div>`;
    }).join('')}`;
}

// ── CATEGORY VIEW ──
function renderCategoryView(el,cat){
  const filtered=allStats.filter(c=>c.status==='ok'&&c.category===cat);
  if(!filtered.length){el.innerHTML='<div class="empty"><i class="ti ti-building-off"></i>এই category-তে কোনো center নেই।</div>';return;}
  el.innerHTML=`
    <div class="kpi-grid">
      <div class="kpi green"><div class="kpi-label">মোট বিক্রয়</div><div class="kpi-value">৳${fmt(filtered.reduce((s,c)=>s+c.total_revenue,0))}</div></div>
      <div class="kpi purple"><div class="kpi-label">মোট উৎপাদন</div><div class="kpi-value">${fmtN(filtered.reduce((s,c)=>s+c.total_produced,0))}</div></div>
      <div class="kpi amber"><div class="kpi-label">মোট স্টক</div><div class="kpi-value">${fmtN(filtered.reduce((s,c)=>s+c.total_stock,0))}</div></div>
      <div class="kpi teal"><div class="kpi-label">Center সংখ্যা</div><div class="kpi-value">${filtered.length}</div></div>
    </div>
    <div class="center-list">${filtered.map(c=>hCard(c)).join('')}</div>`;
}

// ── HORIZONTAL CARD ──
function hCard(c){
  return `<div class="h-card cat${c.category}" onclick="viewDetail('${c.slug}')">
    <div class="h-card-rank cat${c.category}">${c.category}</div>
    <div class="h-card-info">
      <div class="h-card-name">${c.name_bn}</div>
      <div class="h-card-sub"><i class="ti ti-map-pin" style="font-size:10px"></i> ${c.location||c.name_en}</div>
    </div>
    <div class="h-card-stats">
      <div class="h-stat"><div class="h-stat-v" style="color:var(--green)">৳${fmtK(c.total_revenue)}</div><div class="h-stat-l">বিক্রয়</div></div>
      <div class="h-stat"><div class="h-stat-v" style="color:var(--purple)">${fmtK(c.total_produced)}</div><div class="h-stat-l">উৎপাদন</div></div>
      <div class="h-stat"><div class="h-stat-v" style="color:var(--amber)">${fmtK(c.total_stock)}</div><div class="h-stat-l">স্টক</div></div>
      <div class="h-stat"><div class="h-stat-v" style="color:var(--blue)">৳${fmtK(c.today_revenue)}</div><div class="h-stat-l">আজ</div></div>
      <div class="h-stat">
        <div class="tl-dot tl-${c.traffic_light}" style="margin:0 auto 3px"></div>
        <div class="h-stat-l">${toBn(c.perf_score)}</div>
      </div>
    </div>
    <div class="h-card-actions">
      <button class="h-btn primary" onclick="event.stopPropagation();viewDetail('${c.slug}')"><i class="ti ti-eye"></i> দেখুন</button>
    </div>
  </div>`;
}

// ── ALL CENTERS MANAGEMENT (Director only) ──
function renderAllCenters(el){
  if(!centers.length){el.innerHTML='<div class="loading-center"><div class="spinner"></div></div>';return;}
  const isDir=userRole==='director';
  el.innerHTML=`
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
      ${isDir?`<button class="h-btn primary" onclick="openAddModal()"><i class="ti ti-plus"></i> নতুন Center যোগ</button>`:''}
    </div>
    <div class="center-list">
      ${centers.map(c=>`
        <div class="h-card cat${c.category||'B'}">
          <div class="h-card-rank cat${c.category||'B'}">${c.category||'B'}</div>
          <div class="h-card-info">
            <div class="h-card-name">${c.name_bn}</div>
            <div class="h-card-sub">/${c.slug} • ${c.district||''} • ${c.active?'সক্রিয়':'বন্ধ'}</div>
          </div>
          <div class="h-card-actions">
            <button class="h-btn" onclick="viewDetail('${c.slug}')"><i class="ti ti-eye"></i> দেখুন</button>
            ${isDir?`<button class="h-btn" onclick="openEditModal(${c.id})"><i class="ti ti-edit"></i> সম্পাদনা</button>
            <button class="h-btn" onclick="toggleCenter(${c.id})" style="${c.active?'color:var(--red)':'color:var(--green)'}"><i class="ti ti-power"></i>${c.active?'বন্ধ':'চালু'}</button>`:''}
          </div>
        </div>`).join('')}
    </div>`;
}

// ── DETAIL VIEW ──
async function viewDetail(slug){
  currentDetailSlug=slug;
  currentView='detail';
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('topbarTitle').textContent='Center বিস্তারিত';
  const el=document.getElementById('mainContent');
  el.innerHTML='<div class="loading-center"><div class="spinner"></div></div>';
  await fetchDetailData(slug);
}

async function fetchDetailData(slug){
  const el=document.getElementById('mainContent');
  try{
    const r=await fetch(`${API}/center/${slug}`,{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();
    if(!d.success)throw new Error(d.message||d.error);
    currentDetailData=d;
    document.getElementById('topbarTitle').textContent=d.center.name_bn+' — বিস্তারিত';
    renderDetailContent();
  }catch(e){el.innerHTML=`<div class="empty" style="color:var(--red)"><i class="ti ti-alert-circle"></i>${e.message}</div>`;}
}

function renderDetailContent(){
  const el=document.getElementById('mainContent');
  el.innerHTML=`
    <button class="back-btn" onclick="goBack()"><i class="ti ti-arrow-left"></i> ফিরে যান</button>
    <div class="detail-tabs">
      <button class="dtab active" onclick="showDTab('dSales',this)"><i class="ti ti-coin"></i> বিক্রয়</button>
      <button class="dtab" onclick="showDTab('dProd',this)"><i class="ti ti-plant"></i> উৎপাদন</button>
      <button class="dtab" onclick="showDTab('dStock',this)"><i class="ti ti-stack-2"></i> স্টক</button>
      <button class="dtab" onclick="showDTab('dUsers',this)"><i class="ti ti-users"></i> ব্যবহারকারী</button>
      <button class="dtab" onclick="showDTab('dTarget',this)"><i class="ti ti-target"></i> লক্ষ্যমাত্রা</button>
      <button class="dtab" onclick="showDTab('dDamage',this)"><i class="ti ti-alert-triangle"></i> ক্ষতি/নষ্ট</button>
      <button class="dtab" onclick="showDTab('dIncome',this)"><i class="ti ti-cash"></i> অন্যান্য আয়</button>
    </div>
    <div id="detailTabContent"></div>`;
  renderDetailTab('dSales');
}

function goBack(){
  const prevView=currentView==='detail'?'overview':currentView;
  navTo('overview',document.getElementById('nav-overview'));
}

function showDTab(tab,btn){
  currentDTab=tab;
  document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDetailTab(tab);
}

function renderDetailTab(tab){
  const d=currentDetailData;if(!d)return;
  const el=document.getElementById('detailTabContent');
  if(tab==='dSales'){
    const s=d.sales;const maxRev=Math.max(...s.monthly.map(m=>parseFloat(m.revenue)),1);
    el.innerHTML=`
      <div class="kpi-grid">
        <div class="kpi green"><div class="kpi-label">মোট রাজস্ব</div><div class="kpi-value">৳${fmt(s.summary.total_revenue)}</div><div class="kpi-sub">${s.summary.total_invoices} চালান</div></div>
        <div class="kpi blue"><div class="kpi-label">আজকের বিক্রয়</div><div class="kpi-value">৳${fmt(s.today.today_revenue)}</div><div class="kpi-sub">${s.today.today_invoices} চালান</div></div>
        <div class="kpi amber"><div class="kpi-label">পরিশোধিত</div><div class="kpi-value">৳${fmt(s.summary.paid_amount)}</div></div>
        <div class="kpi red"><div class="kpi-label">বকেয়া</div><div class="kpi-value">৳${fmt(s.summary.due_amount)}</div></div>
      </div>
      <div class="card"><div class="card-head">📅 মাসিক বিক্রয়</div>
        <div class="card-body">${s.monthly.map((m,i)=>`<div class="bar-row"><div class="bar-label">${m.label}</div><div class="bar-track"><div class="bar-fill" style="width:${(parseFloat(m.revenue)/maxRev*100).toFixed(0)}%;background:${COLORS[i%COLORS.length]}">${m.invoices} চালান</div></div><div class="bar-end">৳${fmtK(m.revenue)}</div></div>`).join('')||'<div class="empty" style="padding:16px">Data নেই</div>'}</div>
      </div>
      <div class="card"><div class="card-head">🏆 সর্বাধিক বিক্রিত <span>Top 8</span></div>
        <div class="tw"><table><thead><tr><th>চারা</th><th>জাত</th><th>বিক্রিত</th><th>রাজস্ব</th><th>স্টক</th></tr></thead>
        <tbody>${d.top_seedlings.map(s=>`<tr><td>${s.name_bn}</td><td style="color:var(--muted)">${s.variety||'—'}</td><td style="color:var(--purple);font-weight:600">${fmtN(s.total_sold)}</td><td style="color:var(--green);font-weight:600">৳${fmt(s.revenue)}</td><td>${fmtN(s.current_stock)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:16px">বিক্রয় নেই</td></tr>'}</tbody></table></div>
      </div>
      ${userRole!=='director'?`<div class="card"><div class="card-head">🧾 সাম্প্রতিক চালান</div>
        <div class="tw"><table><thead><tr><th>চালান #</th><th>গ্রাহক</th><th>তারিখ</th><th>পরিমাণ</th><th>অবস্থা</th></tr></thead>
        <tbody>${s.recent.map(r=>`<tr><td style="font-family:monospace">${r.invoice_no}</td><td>${r.customer_name||'—'}</td><td>${r.sale_date?.toString().slice(0,10)||'—'}</td><td style="color:var(--green);font-weight:600">৳${fmt(r.total_amount)}</td><td><span class="pill ${r.payment_status==='paid'?'paid':'due'}">${r.payment_status==='paid'?'পরিশোধিত':'বকেয়া'}</span></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:16px">Data নেই</td></tr>'}</tbody></table></div>
      </div>`:''}`;
  }else if(tab==='dProd'){
    const p=d.production;const maxProd=Math.max(...p.by_type.map(t=>parseInt(t.total_qty)),1);
    el.innerHTML=`
      <div class="kpi-grid">
        <div class="kpi purple"><div class="kpi-label">মোট উৎপাদিত</div><div class="kpi-value">${fmtN(p.summary.total_produced)}</div><div class="kpi-sub">${p.summary.total_batches} ব্যাচ</div></div>
        <div class="kpi green"><div class="kpi-label">সফল</div><div class="kpi-value">${fmtN(p.summary.total_success)}</div><div class="kpi-sub">গড় ${toBn(parseFloat(p.summary.avg_success).toFixed(1))}%</div></div>
        <div class="kpi red"><div class="kpi-label">ব্যর্থ</div><div class="kpi-value">${fmtN(p.summary.total_failed)}</div></div>
        <div class="kpi amber"><div class="kpi-label">পাওয়া যাচ্ছে</div><div class="kpi-value">${fmtN(p.summary.total_available)}</div></div>
      </div>
      <div class="card"><div class="card-head">🌱 পদ্ধতি অনুযায়ী</div>
        <div class="card-body">${p.by_type.map((t,i)=>`<div class="bar-row"><div class="bar-label">${typeLabel(t.production_type)}</div><div class="bar-track"><div class="bar-fill" style="width:${(parseInt(t.total_qty)/maxProd*100).toFixed(0)}%;background:${COLORS[i%COLORS.length]}">${t.batches} ব্যাচ</div></div><div class="bar-end">${fmtN(t.total_qty)}</div></div>`).join('')||'<div class="empty" style="padding:16px">Data নেই</div>'}</div>

function renderDistrictSummaryView(el){
  const ok=allStats.filter(c=>c.status==='ok');
  if(!ok.length){el.innerHTML='<div class="empty">Data নেই।</div>';return;}

  // Group by district and division
  const byDistrict={};const byDivision={};
  ok.forEach(c=>{
    const d=c.district||'অজানা';const dv=c.division||'অজানা';
    if(!byDistrict[d]) byDistrict[d]={centers:[],division:dv};
    byDistrict[d].centers.push(c);
    if(!byDivision[dv]) byDivision[dv]={centers:[]};
    byDivision[dv].centers.push(c);

    const cs=data.centers;

    const stock=cs.reduce((s,c)=>s+c.total_stock,0);
    const catA=cs.filter(c=>c.category==='A').length;
    const catB=cs.filter(c=>c.category==='B').length;
    const catC=cs.filter(c=>c.category==='C').length;

    return `
    <div class="card" style="margin-bottom:14px">

    <div class="card">
      <div class="card-head">📋 প্রতিটি Center-এর লক্ষ্যমাত্রা অর্জন

        <thead><tr><th>Center</th><th>Cat</th><th style="color:var(--purple)">অর্থবছরের লক্ষ্যমাত্রা</th><th style="color:var(--blue)">চলতি মাসের লক্ষ্যমাত্রা</th><th style="color:var(--green)">চলতি মাসের অর্জন</th><th>অগ্রগতি</th><th>অবস্থা</th></tr></thead>

      </table></div>
    </div>`;
}

  return `<div class="tw"><table>
    <thead><tr><th>#</th><th>Center</th><th>জেলা</th><th>Cat</th>
      <th style="color:var(--green)">বিক্রয়</th>

      <th style="color:var(--amber)">স্টক</th>
      <th>অবস্থা</th>
    </tr></thead>
    <tbody>${sorted.map((c,i)=>`<tr style="${c===best?'background:#0a2a1a':c===worst?'background:#2a0a0a':''}">
      <td style="font-weight:700;color:${i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#b45309':'var(--muted)'}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
      <td><div style="font-weight:600;font-size:13px">${c.name_bn}</div></td>
      <td style="color:var(--muted);font-size:12px">${c.district||'—'}</td>
      <td><span style="font-size:11px;padding:2px 6px;border-radius:5px;font-weight:700;background:${c.category==='A'?'#1e1b4b':c.category==='B'?'#052e16':'#431407'};color:${c.category==='A'?'#a5b4fc':c.category==='B'?'#4ade80':'#fb923c'}">${c.category}</span></td>
      <td style="font-weight:700;color:${type==='sales'?'var(--green)':'var(--text)'}">৳${fmtK(c.total_revenue)}</td>
      <td style="font-weight:700;color:${type==='production'?'var(--purple)':'var(--text)'}">  ${fmtN(c.total_produced)}</td>
      <td style="font-weight:700;color:${type==='stock'?'var(--amber)':'var(--text)'}">  ${fmtN(c.total_stock)}</td>
      <td><span style="font-size:11px;padding:2px 7px;border-radius:10px;background:${c.traffic_light==='green'?'#064e3b':c.traffic_light==='yellow'?'#451a03':'#450a0a'};color:${c.traffic_light==='green'?'#4ade80':c.traffic_light==='yellow'?'#fbbf24':'#f87171'}">${c.traffic_light==='green'?'ভালো':c.traffic_light==='yellow'?'মাঝারি':'দুর্বল'}</span></td>
    </tr>`).join('')}
    </tbody></table>
    <div style="display:flex;gap:16px;padding:12px 16px;border-top:1px solid var(--border);font-size:12px">
      <span>🟢 <b style="color:#4ade80">${best?.name_bn}</b> — সর্বোচ্চ</span>
      <span>🔴 <b style="color:#f87171">${worst?.name_bn}</b> — সর্বনিম্ন</span>
    </div>
  </div>`;
}

window._rankData=null;
window._sortRanking=(type,btn)=>{
  const data=window._rankData;if(!data)return;
  const sorted=type==='sales'?[...data].sort((a,b)=>b.total_revenue-a.total_revenue):
                type==='production'?[...data].sort((a,b)=>b.total_produced-a.total_produced):
                [...data].sort((a,b)=>b.total_stock-a.total_stock);
  document.getElementById('rankingTableBody').innerHTML=rankTableHTML(sorted,type);
  document.querySelectorAll('[id^=rankBtn-]').forEach(b=>{
    b.style.background='var(--card)';b.style.color='var(--muted)';
  });
  btn.style.background='var(--accent)';btn.style.color='#fff';
};

window._exportCSV=()=>{
  const data=window._rankData;
  if(!data||!data.length){showToast('কোনো data নেই।');return;}
  const headers=['Center','Category','জেলা','বিভাগ','মোট বিক্রয় (৳)','চলতি মাস (৳)','গত মাস (৳)','প্রবৃদ্ধি (%)','মোট উৎপাদন','মোট স্টক','লক্ষ্য অর্জন (%)','Performance Score','অবস্থা'];
  const rows=data.map(c=>[
    c.name_bn,c.category,c.district||'',c.division||'',
    c.total_revenue.toFixed(0),c.current_month_rev.toFixed(0),c.last_month_rev.toFixed(0),
    c.growth_rate.toFixed(1),c.total_produced,c.total_stock,
    c.target_achieved!==null?c.target_achieved.toFixed(1):'N/A',
    c.perf_score,
    c.traffic_light==='green'?'ভালো':c.traffic_light==='yellow'?'মাঝারি':'দুর্বল'
  ]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const bom='\uFEFF';
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});

};

async function saveAdmin(){
  const id=document.getElementById('adminEditId').value;
  const role=document.getElementById('aRole').value;
  const location=document.getElementById('aLocation').value.trim();
  const rLabels={deputy_director:'উপপরিচালক',horticulturist:'উদ্যানতত্ত্ববিদ',nursery_supervisor:'নার্সারী তত্ত্বাবধায়ক'};
  // name = শুধু স্থানের নাম (e.g. "পাচগাছিয়া")
  const name=location;
  const data={
    name,
    email:document.getElementById('aEmail').value.trim(),
    role,
    district:document.getElementById('aDistrict').value.trim(),
    division:document.getElementById('aDivision').value.trim(),
    phone:document.getElementById('aPhone').value.trim(),
    password:document.getElementById('aPassword').value,
    is_active:id?document.getElementById('aIsActive').value==='true':true
  };
  if(!location||!data.email||!data.role) return showToast('স্থানের নাম, ইমেইল ও পদবী দিন।');
  if(!id&&!data.password) return showToast('নতুন admin-এর জন্য পাসওয়ার্ড দিন।');
  try{
    const url=id?`${API}/admins/${id}`:`${API}/admins`;
    const method=id?'PUT':'POST';
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data)});
    const d=await r.json();
    if(!d.success) return showToast(d.message||d.error);
    showToast(d.message);closeAdminModal();await loadAdmins();renderView('adminMgmt');
  }catch{showToast('সমস্যা হয়েছে।');}
}

async function deleteAdmin(id,name){
  if(!confirm(`"${name}" মুছে ফেলবেন?`))return;
  try{
    const r=await fetch(`${API}/admins/${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+token}});
    const d=await r.json();showToast(d.message);await loadAdmins();renderView('adminMgmt');
  }catch{}
}

      </div>
    </label>`).join('');
  document.getElementById('assignModal').classList.add('open');
}
function closeAssignModal(){document.getElementById('assignModal').classList.remove('open');}

async function saveAssignments(){
  const adminId=document.getElementById('assignAdminId').value;
  const checkboxes=document.getElementById('centerCheckboxes').querySelectorAll('input[type=checkbox]:checked');
  const assigned_centers=[...checkboxes].map(cb=>cb.value);
  try{
    const r=await fetch(`${API}/admins/${adminId}/assignments`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({assigned_centers})});
    const d=await r.json();
    if(!d.success) return showToast(d.message||d.error);
    showToast(d.message);closeAssignModal();await loadAdmins();renderView('adminMgmt');
  }catch{showToast('সমস্যা হয়েছে।');}
}

// ── HELPERS ──
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function toBn(n){return String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d]);}
function fmt(n){return toBn(parseInt(parseFloat(n||0)).toLocaleString('en-IN'));}
function fmtN(n){return toBn(parseInt(n||0).toLocaleString('en-IN'));}
function fmtK(n){const v=parseFloat(n||0);if(v>=100000)return toBn((v/100000).toFixed(1))+'L';if(v>=1000)return toBn((v/1000).toFixed(1))+'K';return toBn(Math.round(v));}
function scoreColor(s){return s>=70?'#4ade80':s>=45?'#fbbf24':'#f87171';}
function tlLabel(t){return t==='green'?'ভালো':t==='yellow'?'সতর্ক':'সমস্যা';}
function tlBorderColor(t){return t==='green'?'#16a34a':t==='yellow'?'#d97706':'#dc2626';}
function typeLabel(t){return{seed:'বীজ',cutting:'কাটিং',layering:'লেয়ারিং',grafting:'গ্রাফটিং',budding:'বাডিং',tissue_culture:'টিস্যু কালচার',purchase:'ক্রয়'}[t]||t;}
function roleLabel(r){return{admin:'Admin',manager:'Manager',production_officer:'Production',sales_operator:'Sales',viewer:'Viewer'}[r]||r;}
function roleColor(r){return{admin:'#7c3aed',manager:'#0ea5e9',production_officer:'#10b981',sales_operator:'#f59e0b',viewer:'#64748b'}[r]||'#64748b';}
function monthLabel(m){return['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'][m-1]||m;}
</script>
